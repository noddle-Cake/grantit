name: CI / Deploy

# Every PR: type-check, lint, build, and validate the Cloudflare bundle (no secrets needed).
# Push to main: the same build is deployed to https://tidepath.joseyandco.com.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx cf build

      - name: Validate deploy (dry run)
        run: npx cf deploy --prebuilt --mode production --dry-run

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npx cf deploy --prebuilt --mode production --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
