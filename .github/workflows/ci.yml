name: CI

# Pull requests: type-check, lint, test, build, and validate the Cloudflare bundle (no secrets needed).
# Push to main: the same build is then deployed to production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx cf build

      - name: Validate deploy (dry run)
        run: npx cf deploy --prebuilt --mode production --dry-run

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npx cf deploy --prebuilt --mode production --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
