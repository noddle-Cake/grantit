name: CI

# Runs on GitHub-hosted runners. CI verifies and builds; deploys are
# `sudo bash ~/srv-setup/31-grantit.sh` on 5820 (see docs/deploy.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Shared (types, rules, sample data)
        run: npm run check -w shared

      - name: API
        run: npm run check -w api

      - name: Web
        run: npm run check -w web

      - name: Build web
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist
          retention-days: 14
