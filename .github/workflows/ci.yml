name: CI

# Runs on GitHub-hosted runners. CI verifies and builds. When it passes on main, 5820 deploys that commit
# automatically (grantit-autodeploy) and the Deploy workflow confirms it went live (see docs/deploy.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: grantit
          POSTGRES_PASSWORD: grantit
          POSTGRES_DB: grantit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantit -d grantit_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Shared (types, rules, sample data)
        run: npm run check -w shared

      - name: API (tests run against the Postgres service)
        run: npm run check -w api
        env:
          TEST_DATABASE_URL: postgres://grantit:grantit@localhost:5432/grantit_test

      - name: Web
        run: npm run check -w web

      - name: Build web
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist
          retention-days: 14
