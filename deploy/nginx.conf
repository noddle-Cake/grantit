# Grantit on 5820: nginx-unprivileged serving the Vite build (mounted read-only).
# Replaces the image's default.conf (included inside the http block); installed by 31-grantit.sh.

# Traffic arrives through the Cloudflare Tunnel, so $remote_addr is the tunnel, not the visitor. The origin only
# listens on 127.0.0.1, so CF-Connecting-IP always comes from Cloudflare and is the real client address.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Per-client request rates. A page load fetches a few dozen hashed assets at once, which the burst absorbs;
# the steady rate is what slows password guessing against basic auth.
limit_req_zone $client_ip zone=grantit_site:10m rate=5r/s;
limit_req_zone $client_ip zone=grantit_api:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Everything is behind basic auth, the app's only sign-in. The credential lives only on 5820
    # (sites/grantit/access.env), never in git; 31-grantit.sh writes the hashed file that is mounted here.
    auth_basic "Grantit";
    auth_basic_user_file /etc/nginx/htpasswd;
    limit_req zone=grantit_site burst=60 nodelay;

    # Deployed commit, polled by the Deploy workflow and grantit-autodeploy. Public: the repo is public anyway.
    location = /version.txt {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build assets never change: cache for a year (private: they sit behind auth).
    location /assets/ {
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Health check stays reachable without credentials (it reports status only).
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # The API lives at /api on the same origin (docs/api.md), proxied to the grantit-api container.
    location /api/ {
        limit_req zone=grantit_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes (/grants/…, /knowledge, …) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # /api is proxied, not a client route; anything else falls back to the app shell.
        try_files $uri $uri/ /index.html;
    }
}
